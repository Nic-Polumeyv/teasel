[package]
name = "teasel"
version = "0.0.0"
edition = "2024"
description = "A JavaScript parser in Rust"
license = "MIT"
repository = "https://github.com/Nic-Polumeyv/teasel"

[features]
default = ["typescript"]
typescript = []

[dependencies]

[workspace]
members = ["bindings/node", "bindings/wasm"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"] }
rustc-demangle = "0.1.28"

[profile.profiling]
inherits = "release"
debug = true
strip = false
