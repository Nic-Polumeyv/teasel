[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.14"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Nic-Polumeyv/teasel"

[workspace.lints.rust]
unreachable_pub = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
