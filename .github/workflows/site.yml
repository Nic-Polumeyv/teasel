name: site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - package/index.d.ts
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::038462749233:role/teasel-github-actions
          aws-region: us-east-1
      - run: aws s3 sync build s3://teasel.dev --delete
      - run: aws cloudfront create-invalidation --distribution-id E2MJUFV76BN8VA --paths "/*"
