name: site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - package/index.d.ts
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::038462749233:role/teasel-github-actions
          aws-region: us-east-1
      - run: aws s3 sync build s3://teasel.dev --delete
      - run: aws cloudfront create-invalidation --distribution-id E2MJUFV76BN8VA --paths "/*"
