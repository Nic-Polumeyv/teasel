name: version

# Turns pending changesets into a Version Packages PR: bumps package.json, syncs the crates,
# writes the changelog. Merging that PR touches Cargo.toml on main, which wakes release.yml.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.repository == 'Nic-Polumeyv/teasel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node .github/version.js > body.md
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          [ -s body.md ] || { echo "no changesets"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B changeset-release/main
          git add --all
          git commit -m 'Version Packages'
          git push --force origin changeset-release/main
          number=$(gh pr list --head changeset-release/main --base main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh pr edit "$number" --title 'Version Packages' --body-file body.md
          else gh pr create --head changeset-release/main --base main --title 'Version Packages' --body-file body.md; fi
        env:
          GH_TOKEN: ${{ github.token }}
