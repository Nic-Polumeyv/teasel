name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - run: git clone --depth 1 https://github.com/tc39/test262-parser-tests tests/test262-parser-tests
      - run: cargo test --release
      - run: bun install --frozen-lockfile
        working-directory: package
      - run: bun run build && bun run build:wasm && bun run test && node check.js ../tests/test262-parser-tests/pass ../tests/test262-parser-tests/pass-explicit
        working-directory: package

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: package
      - run: bun run build -- --target ${{ matrix.target }}
        working-directory: package
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: package/*.node
          if-no-files-found: error

  wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: package
      - run: bun run build:wasm
        working-directory: package
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: package/teasel.wasm
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
        working-directory: package
      - uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: package/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: package
      - run: cp README.md package/README.md
      - run: bunx napi artifacts -d artifacts && bunx napi pre-publish -t npm
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public --provenance
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
