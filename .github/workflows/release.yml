name: release

# Fires on a main push that touches Cargo.toml; the gate lets the rest run only when that version
# is not on npm yet. The Version Packages PR is what bumps Cargo.toml, so merging it is the release.
# The tag marks the release and is created after npm has it, never before.
on:
  push:
    branches: [main]
    paths: ['Cargo.toml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  gate:
    if: github.repository == 'Nic-Polumeyv/teasel'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(jq -r .version package/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf -o /dev/null "https://registry.npmjs.org/@teasel%2Fparser/$version"; then
            echo "$version is on npm, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: gate
    if: needs.gate.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [gate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: npm ci
        working-directory: package
      - uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          path: package/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: package
      - run: cp README.md package/README.md
      - run: node release.js
        working-directory: package
      - run: |
          tag="v${{ needs.gate.outputs.version }}"
          git ls-remote --exit-code --tags origin "$tag" || { git tag "$tag" && git push origin "$tag"; }
          gh release view "$tag" || gh release create "$tag" --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
