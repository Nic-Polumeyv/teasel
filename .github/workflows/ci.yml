name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: git clone --depth 1 https://github.com/tc39/test262-parser-tests tests/test262-parser-tests
      - run: git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/TypeScript tests/TypeScript && git -C tests/TypeScript sparse-checkout set --no-cone '/tsc/testdata/tests/cases/conformance/**' '/tsc/testdata/baselines/reference/conformance/*.errors.txt'
      - run: cargo test --release
      - run: npm ci
        working-directory: package
      - run: npm run types && npm run build && npm run build:wasm && npm run test && node check.js ../tests/test262-parser-tests/pass ../tests/test262-parser-tests/pass-explicit
        working-directory: package

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: npm ci
        working-directory: package
      - run: npm run build -- --target ${{ matrix.target }}
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: package/*.node
          if-no-files-found: error

  wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
        working-directory: package
      - run: npm run build:wasm
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: package/teasel.wasm
          if-no-files-found: error
