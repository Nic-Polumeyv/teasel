name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7 binaryen
      - run: git clone --depth 1 https://github.com/tc39/test262-parser-tests tests/test262-parser-tests
      - run: git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/TypeScript tests/TypeScript && git -C tests/TypeScript sparse-checkout set --no-cone '/tsc/testdata/tests/cases/conformance/**' '/tsc/testdata/baselines/reference/conformance/*.errors.txt'
      - run: cargo test --release
      - run: npm ci
        working-directory: package
      - run: npm run types && npm run build && npm run build:wasm && npm run test && node check.js ../tests/test262-parser-tests/pass ../tests/test262-parser-tests/pass-explicit
        working-directory: package

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: npm ci
        working-directory: package
      - run: npm run build -- --target ${{ matrix.target }}
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: package/*.node
          if-no-files-found: error

  wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g binaryen
      - run: npm ci
        working-directory: package
      - run: npm run build:wasm
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: package/teasel.wasm
          if-no-files-found: error

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
      release: ${{ steps.diff.outputs.release }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git fetch --depth=1 origin "$base"; then
            changed=all
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          docs=false; bumped=false
          [ "$changed" = all ] && docs=true
          echo "$changed" | grep -qE '^(docs/|package/index.d.ts|.github/workflows/ci.yml)' && docs=true
          echo "$changed" | grep -qx Cargo.toml && bumped=true
          [ '${{ github.event_name }}' = workflow_dispatch ] && bumped=true
          version=$(jq -r .version package/package.json)
          release=false
          if [ "$bumped" = true ] && [ '${{ github.ref }}' = refs/heads/main ] && ! curl -sf -o /dev/null "https://registry.npmjs.org/@teasel%2Fparser/$version"; then release=true; fi
          printf 'docs=%s\nrelease=%s\nversion=%s\n' "$docs" "$release" "$version" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/build
          if-no-files-found: error

  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::038462749233:role/teasel-github-actions
          aws-region: us-east-1
      - run: aws s3 sync build s3://teasel.dev --delete
      - run: aws cloudfront create-invalidation --distribution-id E2MJUFV76BN8VA --paths "/*"

  version:
    if: github.repository == 'Nic-Polumeyv/teasel' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node .github/version.js > "$RUNNER_TEMP/body.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          [ -s "$RUNNER_TEMP/body.md" ] || { echo "no changesets"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B changeset-release/main
          git add --all
          git commit -m 'Version Packages'
          git push --force origin changeset-release/main
          number=$(gh pr list --head changeset-release/main --base main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh pr edit "$number" --title 'Version Packages' --body-file "$RUNNER_TEMP/body.md"
          else gh pr create --head changeset-release/main --base main --title 'Version Packages' --body-file "$RUNNER_TEMP/body.md"; fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [changes, build, wasm]
    if: github.repository == 'Nic-Polumeyv/teasel' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: npm ci
        working-directory: package
      - uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          path: package/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: package
      - run: cp README.md package/README.md
      - run: node release.js
        working-directory: package
      - run: |
          tag="v${{ needs.changes.outputs.version }}"
          git ls-remote --exit-code --tags origin "$tag" || { git tag "$tag" && git push origin "$tag"; }
          gh release view "$tag" || gh release create "$tag" --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
