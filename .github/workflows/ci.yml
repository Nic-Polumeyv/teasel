name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7 binaryen
      - run: git clone --depth 1 https://github.com/tc39/test262-parser-tests tests/test262-parser-tests
      - run: git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/TypeScript tests/TypeScript && git -C tests/TypeScript sparse-checkout set --no-cone '/tsc/testdata/tests/cases/conformance/**' '/tsc/testdata/baselines/reference/conformance/*.errors.txt'
      - run: cargo test --release
      - run: npm ci
        working-directory: package
      - run: npm run types && npm run build && npm run build:wasm && npm run test && node check.js ../tests/test262-parser-tests/pass ../tests/test262-parser-tests/pass-explicit
        working-directory: package

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g typescript@7
      - run: npm ci
        working-directory: package
      - run: npm run build -- --target ${{ matrix.target }}
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: package/*.node
          if-no-files-found: error

  wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g binaryen
      - run: npm ci
        working-directory: package
      - run: npm run build:wasm
        working-directory: package
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: package/teasel.wasm
          if-no-files-found: error

  # what the push or pull request touched, so the docs build only when they changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git fetch --depth=1 origin "$base"; then
            echo docs=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- docs package/index.d.ts .github/workflows/ci.yml | grep -q .; then
            echo docs=true >> "$GITHUB_OUTPUT"
          else
            echo docs=false >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/build
          if-no-files-found: error

  # main only, and not when release calls this workflow: the github context is the caller's
  deploy:
    needs: docs
    if: github.workflow == 'ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::038462749233:role/teasel-github-actions
          aws-region: us-east-1
      - run: aws s3 sync build s3://teasel.dev --delete
      - run: aws cloudfront create-invalidation --distribution-id E2MJUFV76BN8VA --paths "/*"
